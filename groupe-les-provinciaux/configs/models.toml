# Registre des modèles. Les prix (€/M tokens) servent au plafond budgétaire et au rapport :
# VÉRIFIEZ-LES sur la page tarifaire du fournisseur avant une campagne. Le coût réel est
# calculé à partir des tokens renvoyés par l'API (champ usage).

[random]
kind = "random"

# --- Via OpenRouter, espace du cours (OPENROUTER_API_KEY) — configuration recommandée ---
# L'espace OpenRouter du cours n'autorise qu'une liste de modèles (garde-fou « teaching-students ») :
# GPT-5 et Qwen2.5/Qwen3-VL y sont bloqués (erreur 404). Modèles vision autorisés relevés le 27/11/2026.
# Prix convertis avec 1 $ ≈ 0,87 €.

[gemini-flash-lite-or]          # modèle API propriétaire
kind = "openai_compat"
model = "google/gemini-3.5-flash-lite"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
price_in_eur_per_mtok = 0.26    # 0.30 $
price_out_eur_per_mtok = 2.18   # 2.50 $
max_output_tokens = 256
est_input_tokens_per_frame = 300

[qwen-27b-or]                   # Qwen à poids ouverts, taille intermédiaire
kind = "openai_compat"
model = "qwen/qwen3.8-27b"
extra = { reasoning = { enabled = false } }   # sinon le modèle « réfléchit » et épuise ses tokens
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
price_in_eur_per_mtok = 0.035   # 0.04 $
price_out_eur_per_mtok = 1.30   # 1.50 $
max_output_tokens = 256
est_input_tokens_per_frame = 350

[qwen-9b-or]                    # petit Qwen (9B, exécutable en local) : proxy du « 3e modèle local »
kind = "openai_compat"
model = "qwen/qwen3.5-9b"
extra = { reasoning = { enabled = false } }   # sinon le modèle « réfléchit » et épuise ses tokens
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
price_in_eur_per_mtok = 0.06    # 0.07 $
price_out_eur_per_mtok = 0.09   # 0.10 $
max_output_tokens = 256
est_input_tokens_per_frame = 350

# --- Accès direct aux fournisseurs ---
[gpt5-mini]
kind = "openai_compat"
model = "gpt-5-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
price_in_eur_per_mtok = 0.23
price_out_eur_per_mtok = 1.80
image_detail = "low"
max_output_tokens = 512          # GPT-5 raisonne avant de répondre : garder de la marge
est_input_tokens_per_frame = 100
extra = { reasoning_effort = "minimal" }

[gpt5]
kind = "openai_compat"
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"
price_in_eur_per_mtok = 1.15
price_out_eur_per_mtok = 9.20
image_detail = "low"
max_output_tokens = 512
est_input_tokens_per_frame = 100
extra = { reasoning_effort = "minimal" }

# Qwen-VL via l'API compatible OpenAI d'Alibaba Cloud (DashScope, région internationale)
[qwen-vl]
kind = "openai_compat"
model = "qwen-vl-plus"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
price_in_eur_per_mtok = 0.20
price_out_eur_per_mtok = 0.60
max_output_tokens = 16
est_input_tokens_per_frame = 350

# Même famille via OpenRouter (une seule clé pour plusieurs fournisseurs)
[qwen-vl-openrouter]
kind = "openai_compat"
model = "qwen/qwen2.5-vl-72b-instruct"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
price_in_eur_per_mtok = 0.70    # 0.80 $
price_out_eur_per_mtok = 0.87   # 1.00 $
max_output_tokens = 16
est_input_tokens_per_frame = 350

# Extension « 3e modèle local » : Ollama (ollama pull qwen2.5vl:7b) ou vLLM, coût 0
[qwen-local-ollama]
kind = "openai_compat"
model = "qwen2.5vl:7b"
base_url = "http://localhost:11434/v1"
api_key_env = "OLLAMA_API_KEY"
max_output_tokens = 16

# Alternative sans serveur : transformers directement (GPU recommandé)
[qwen-local-hf]
kind = "qwen_local"
model = "Qwen/Qwen2.5-VL-3B-Instruct"
max_output_tokens = 16
